name: Auto-Release APK on Version Tag

on:
  push:
    tags:
      - 'v*.*.*'  # v1.0.0, v1.1.0 jaise tags par chalega
  workflow_dispatch:  # Manual trigger ke liye

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Extract version from tag or fallback
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="v0.0.0-dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_date=$(date '+%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build Real Android APK (Expo Prebuild + Gradle)
        working-directory: ./frontend
        run: |
          # Native android folder generate karega
          npx expo prebuild --platform android --clean
          
          # Real Release APK compile karega
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          
          # Artifact folder me copy karega
          mkdir -p ../../build_artifacts
          cp app/build/outputs/apk/release/app-release.apk ../../build_artifacts/DivyaLive-${{ steps.version.outputs.version }}.apk

      - name: Create Release Notes
        id: notes
        run: |
          cat > release_notes.md << 'EOF'
          # 🎉 DivyaLive ${{ steps.version.outputs.version }} Released!
          
          ## ✨ Features
          - Live wallpaper animations with 7 curated presets
          - Real-time image uploads from Admin portal
          - Battery-aware quality settings (High/Balanced/Battery Saver)
          - Per-wallpaper effect intensity control
          
          ## 🔧 Improvements
          - Optimized Expo build configuration
          - Android Live Wallpaper Service integration
          - Enhanced performance monitoring
          - Improved error handling
          
          ## 📱 Technical Details
          - **Release Date:** ${{ steps.version.outputs.release_date }}
          - **Platform:** Android
          - **Format:** APK
          - **Min API Level:** 24
          - **Target API Level:** 34
          
          ## 📥 Installation Instructions
          1. Download `DivyaLive-${{ steps.version.outputs.version }}.apk` from Assets
          2. Enable "Unknown Sources" in Settings → Security
          3. Open the APK file to install
          4. Launch DivyaLive from your app drawer
          
          ## 📋 System Requirements
          - Android 7.0+ (API 24+)
          - Minimum 100MB free storage
          - Recommended: 2GB+ RAM
          
          ## 🔄 What Changed
          See commit history: https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.version }}
          
          ## 📧 Feedback
          Report issues: https://github.com/${{ github.repository }}/issues
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "🚀 DivyaLive ${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            build_artifacts/DivyaLive-${{ steps.version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Build Summary
        if: always()
        run: |
          echo "## ✅ Release Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** ${{ steps.version.outputs.release_date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release URL:** https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY

  notify-success:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Success Notification
        run: |
          echo "🎉 Release successfully published!"

  notify-failure:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Failure Notification
        run: |
          echo "❌ Build failed for release!"
